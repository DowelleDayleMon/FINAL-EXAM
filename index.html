<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Arena: Comprog 1 Final</title>
<style>
:root{--bg:#070a16;--pn:#0f1530;--ln:#222d57;--tx:#eaf0ff;--mu:#8f9bd0;--cy:#3ee6ff;--vi:#9b6bff;--li:#7cff6b;--am:#ffb84d;--rd:#ff4d5e;--pk:#ff6fae;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 "Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 40% at 20% 20%,rgba(62,230,255,.22),transparent 60%),radial-gradient(35% 35% at 80% 15%,rgba(155,107,255,.30),transparent 60%),radial-gradient(40% 40% at 70% 90%,rgba(255,111,174,.18),transparent 60%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,4%) rotate(4deg) scale(1.08)}}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(62,230,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(62,230,255,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);animation:grid 12s linear infinite}
@keyframes grid{to{background-position:46px 46px}}
button,textarea,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 26px;border-bottom:1px solid var(--ln);background:rgba(7,10,22,.72);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.3rem;letter-spacing:-.02em}.logo i{font-style:normal;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#06101f;background:linear-gradient(135deg,var(--cy),var(--vi));box-shadow:0 0 24px rgba(62,230,255,.5);font:800 15px ui-monospace,Consolas,monospace;animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(155,107,255,.8)}}.logo small{display:block;font-size:.7rem;font-weight:600;color:var(--mu);letter-spacing:.14em;text-transform:uppercase}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools input{width:150px;padding:8px 12px;border-radius:12px;border:1px solid var(--ln);background:#0a1030;font-size:.9rem}
.tb{padding:8px 14px;border-radius:12px;border:1px solid var(--ln);background:#0c1232;cursor:pointer;font-weight:700;font-size:.9rem;transition:.15s}.tb:hover:not(:disabled){border-color:var(--cy);box-shadow:0 0 18px rgba(62,230,255,.3);transform:translateY(-1px)}.tb.red:hover{border-color:var(--rd);box-shadow:0 0 18px rgba(255,77,94,.35)}.tb:disabled{opacity:.4;cursor:not-allowed}
#hud{display:flex;align-items:center;gap:14px}#player{display:flex;align-items:center;gap:10px;font-weight:700}#player .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#06101f;background:linear-gradient(135deg,var(--li),var(--cy))}
#clock{position:relative;width:78px;height:78px;display:grid;place-items:center;font-weight:900;font-size:1.1rem;font-variant-numeric:tabular-nums}#clock svg{position:absolute;inset:0;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(62,230,255,.5))}#clock circle{fill:none;stroke-width:6;stroke-linecap:round}.rt{stroke:var(--ln)}.rp{stroke:var(--cy);stroke-dasharray:201;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear,stroke .3s}
#clock.warn .rp{stroke:var(--am)}#clock.danger .rp{stroke:var(--rd)}#clock.danger{color:var(--rd);animation:beat .8s infinite}@keyframes beat{50%{transform:scale(1.1)}}
main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:22px;padding:22px 26px 60px;max-width:1600px;margin:0 auto}@media(max-width:960px){main{grid-template-columns:1fr}}
.deck{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);display:flex;flex-direction:column;padding:16px;border:1px solid var(--ln);border-radius:22px;background:rgba(15,21,48,.72);backdrop-filter:blur(8px)}@media(max-width:960px){.deck{position:static;max-height:none}}
.deck h3{margin:0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between}
.xp{height:8px;border-radius:9px;background:#141c40;margin:10px 0 14px;overflow:hidden}.xp i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));background-size:200% 100%;animation:flow 3s linear infinite;transition:width .8s cubic-bezier(.3,1,.4,1)}@keyframes flow{to{background-position:200% 0}}
/* ---------- playing cards ---------- */
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;overflow:auto;padding:8px 4px 12px}
@keyframes rise{from{transform:translateY(12px) scale(.94);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,184,77,.18),0 0 28px rgba(255,184,77,.5)}}
.card{position:relative;display:block;width:100%;aspect-ratio:5/7;padding:0;border:0;background:none;cursor:pointer;perspective:700px;transition:transform .18s}
.card.anim{animation:rise .5s both}
.card:hover:not(:disabled):not(.flipped){transform:translateY(-5px) rotate(-1.5deg)}.card:disabled{cursor:not-allowed}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.25,.4,1)}
.card.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,rgba(62,230,255,.16) 0 6px,transparent 6px 12px),repeating-linear-gradient(-45deg,rgba(155,107,255,.22) 0 6px,transparent 6px 12px),linear-gradient(160deg,#1a2360,#0b1030);border:1.5px solid #3a4a9a;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.back::before{content:"";position:absolute;inset:5px;border:1px solid rgba(62,230,255,.5);border-radius:7px}
.back::after{content:"</>";position:absolute;inset:0;display:grid;place-items:center;font:800 .95rem ui-monospace,Consolas,monospace;color:var(--cy);text-shadow:0 0 10px rgba(62,230,255,.8)}
.card:hover:not(:disabled) .back{border-color:var(--cy);box-shadow:0 8px 22px rgba(62,230,255,.3)}
.front{transform:rotateY(180deg);background:#f7f5ee;color:#16181f;border:1.5px solid #cfcab9;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:5px 6px;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.front.red .cn,.front.red .pip{color:#d6213a}
.cn{font:800 .85rem/1 Georgia,"Times New Roman",serif;text-align:left}.cn.bt{align-self:flex-end;transform:rotate(180deg)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;padding:0 1px}
.pip{font-size:2.1rem;line-height:1}.mid b{font-size:.62rem;line-height:1.15;color:#16181f}.mid small{font-size:.54rem;line-height:1.15;color:#555b6e;margin-top:2px;word-break:break-word}
.front.s100{border-color:#e9c34a;box-shadow:0 0 0 2px #e9c34a,0 0 18px rgba(233,195,74,.6)}.front.s50{border-color:#b9c3d6;box-shadow:0 0 0 2px #b9c3d6}.front.s0{border-color:#8a5a3c;box-shadow:0 0 0 2px #8a5a3c}
.card.live .front{border-color:var(--am);animation:glow 1.4s infinite}
#arena{min-width:0}.hero{display:grid;place-items:center;text-align:center;min-height:68vh;border:1px dashed var(--ln);border-radius:28px;padding:30px;background:rgba(15,21,48,.45)}
.orb{width:140px;height:140px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--cy) 20%,var(--vi) 60%,#1b1060);box-shadow:0 0 60px rgba(155,107,255,.7),inset 0 0 30px rgba(0,0,0,.4);animation:float 4s ease-in-out infinite;display:grid;place-items:center;font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 0 18px #fff}@keyframes float{50%{transform:translateY(-14px) scale(1.04)}}
.hero h2{font-size:2.3rem;margin:0 0 6px;letter-spacing:-.03em;background:linear-gradient(90deg,var(--cy),var(--pk),var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--mu);margin:0 0 16px;max-width:46ch}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.stats div{padding:10px 18px;border-radius:16px;background:#0e1538;border:1px solid var(--ln)}.stats b{display:block;font-size:1.5rem}.stats span{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.panel{background:rgba(15,21,48,.82);border:1px solid var(--ln);border-radius:22px;backdrop-filter:blur(6px)}
.prob{padding:22px 26px;position:relative;overflow:hidden}.prob::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--cy),var(--vi))}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(155,107,255,.2);color:#c9b3ff;border:1px solid rgba(155,107,255,.4)}.prob h2{margin:8px 0 6px;font-size:1.7rem;letter-spacing:-.02em}
.sig,.exs{font-family:ui-monospace,Consolas,monospace;background:#080d28;border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.93rem;color:var(--cy);overflow-x:auto}.exs{color:var(--li);white-space:pre}.note{color:var(--mu);font-size:.88rem;margin:0}
.ed{margin-top:18px;overflow:hidden;border-color:#2c3a78;box-shadow:0 0 0 1px rgba(62,230,255,.08),0 20px 50px rgba(0,0,0,.4)}.eh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);background:#0b1130}.eh b{display:flex;align-items:center;gap:8px}.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.edw{display:grid;grid-template-columns:48px 1fr;background:#060a1d}.gut{padding:16px 0;text-align:right;color:#4a578f;font:16px/1.6 ui-monospace,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none;padding-right:10px;border-right:1px solid #141c45}
textarea{display:block;width:100%;height:44vh;min-height:280px;border:0;padding:16px 16px;background:transparent;color:#eaf0ff;caret-color:var(--cy);font:16px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace;tab-size:4;resize:vertical;white-space:pre;overflow:auto}textarea:focus{outline:none}.edw:focus-within{box-shadow:inset 0 0 0 2px rgba(62,230,255,.35)}textarea:disabled{opacity:.5}
.btn{border:0;border-radius:14px;padding:10px 24px;font-weight:800;cursor:pointer;color:#06101f;background:linear-gradient(135deg,var(--cy),#6ea8ff);box-shadow:0 8px 24px rgba(62,230,255,.3);transition:.15s}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
#run:not(:disabled)::before{content:"\25B6  "}
.meter{margin-top:18px;padding:18px 22px}.mh{display:flex;justify-content:space-between;color:var(--mu);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}.cell{height:36px;border-radius:10px;background:#121a3f;border:1px solid var(--ln)}
.cell.on{background:linear-gradient(180deg,var(--li),#2ed46a);border-color:var(--li);box-shadow:0 0 18px rgba(124,255,107,.55);animation:lit .5s both}.cell.off{background:#2a1226;border-color:#6a2040;animation:lit .5s both}@keyframes lit{from{transform:scale(.5);opacity:.2}to{transform:none;opacity:1}}
.marks{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:6px;font-size:.7rem;color:var(--mu);font-weight:800;text-align:center}.marks .m{color:var(--am)}.marks .f{color:var(--li)}
#msg{margin-top:12px;min-height:1.6em}#msg .e{border-left:4px solid var(--rd);background:#2a1226;padding:10px 14px;border-radius:0 12px 12px 0}pre{white-space:pre-wrap;font:.85rem ui-monospace,Consolas,monospace;margin:8px 0 0}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,30,60,.6) 100%)}#dmg.on{animation:dmg .8s ease-out}@keyframes dmg{0%{opacity:1}100%{opacity:0}}
body.hit main,body.hit header{animation:shake .45s}@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,16,.86);backdrop-filter:blur(9px)}.ov.on{display:flex}
.box{width:min(580px,100%);padding:30px;text-align:center;border-radius:30px;background:linear-gradient(160deg,#18225a,#0c1233);border:1px solid #2c3a78;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(155,107,255,.2);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.7);opacity:0}}
.box h2{margin:0;font-size:1.9rem;letter-spacing:-.02em}.big{font-size:6rem;font-weight:900;line-height:1;margin:6px 0;background:linear-gradient(135deg,var(--li),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;filter:drop-shadow(0 0 22px rgba(124,255,107,.4))}.big.amber{background:linear-gradient(135deg,var(--am),#ff8a4d);-webkit-background-clip:text;background-clip:text}.big.red{background:linear-gradient(135deg,#ff8a95,var(--rd));-webkit-background-clip:text;background-clip:text}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.jc{padding:3px 12px;border-radius:99px;background:#1a2460;font-weight:800;animation:pop .4s both}.sub{color:var(--mu);margin:8px 0 18px}.rank{display:inline-block;margin:6px 0;padding:4px 16px;border-radius:99px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,var(--am),var(--pk));color:#1a0b14}
.slam{font-size:3.2rem;font-weight:900;letter-spacing:.05em;color:var(--rd);animation:slam .6s cubic-bezier(.2,1.6,.4,1)}@keyframes slam{from{transform:scale(3);opacity:0}}
#intro{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;pointer-events:none;flex-direction:column;text-align:center;background:radial-gradient(circle,rgba(155,107,255,.35),transparent 60%)}#intro.on{display:flex;animation:introout 1.7s forwards}#intro small{letter-spacing:.4em;color:var(--cy);font-weight:800}#intro h1{margin:6px 0 0;font-size:clamp(2.2rem,6vw,4.5rem);letter-spacing:-.03em;text-shadow:0 0 40px rgba(62,230,255,.7);animation:slam .7s cubic-bezier(.2,1.5,.4,1)}@keyframes introout{0%,75%{opacity:1}100%{opacity:0}}
#burst{position:fixed;inset:0;z-index:85;pointer-events:none;overflow:hidden}#burst i{position:absolute;width:10px;height:15px;border-radius:3px;opacity:0;animation:fly var(--t) linear var(--d) both}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.1,.8,.3,1)}45%{transform:translate(var(--dx),var(--up)) rotate(var(--r));opacity:1;animation-timing-function:cubic-bezier(.55,0,.9,.6)}100%{transform:translate(calc(var(--dx)*1.5),var(--fall)) rotate(calc(var(--r)*2));opacity:1}}
#tp,#lbx{width:min(780px,100%);max-height:88vh;overflow:auto;text-align:left;padding:22px}#tp h3,#lbx h3{margin:14px 0 6px}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{padding:6px 12px;font-size:.82rem}

.eact{display:flex;align-items:center}.stp{background:linear-gradient(135deg,#ff8a95,var(--rd));box-shadow:0 8px 24px rgba(255,77,94,.3);margin-right:8px}
.jk{margin-top:14px;padding-top:14px;border-top:1px dashed var(--ln)}.jkh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.jkh b{color:var(--am)}.jkr{display:flex;gap:12px}
.jkc{position:relative;width:62px;aspect-ratio:5/7;padding:0;border:0;background:none;cursor:pointer;perspective:600px;transition:transform .18s}.jkc:hover:not(:disabled){transform:translateY(-4px) rotate(-3deg)}.jkc:disabled:not(.used){opacity:.5;cursor:not-allowed}.jkc.used{cursor:default}

F01:`The ranges never overlap, so an if / else if ladder fits. The important choice is the ORDER: starting from the highest range means each branch needs only one comparison, because every higher range was already ruled out above it. The final else catches the leftover case (below 39), so we never have to write that condition.`,
F02:`I split the job into two stages: the distance fare first, then the discount. Starting the fare at 13 already handles the first 4 km, so the extra charge is needed only when km > 4. The discount is a separate if, so it applies no matter how long the trip is. Check: getFare(8, 'S') is 13 + 4 x 2 = 21, minus 2 = 19.`,
F03:`Since a smaller GWA is better, the ladder runs from low to high. The boundary values 1.25 and 1.50 belong to the better scholarship, which is why the tests use <= instead of <. The second test does not repeat "above 1.25" because the first test already filtered those values out.`,
F04:`There are two steps: convert, then classify. I store the Celsius value in a variable and classify THAT, not the Fahrenheit input. The fraction 5 / 9 is safe only because fahrenheit is a double and the multiplication happens first. Then I walk down from the hottest range, so each test needs just one comparison.`,
F05:`The weights are percentages, so I wrote them as decimals (0.30, 0.50, 0.20) and added the three products into one variable. Only after I had the final grade did I classify it, from the highest remark down. Check: 80 x 0.30 + 90 x 0.50 + 70 x 0.20 = 83, which is 'P'.`,
F06:`The tax is charged on the excess, not on the whole salary, so each bracket subtracts its starting point. For the top bracket the 3,000 is the full tax of the middle bracket (15% of 20,000), and then 20% applies to what is above 40,000. Check: 50,000 gives 3,000 + 0.20 x 10,000 = 5,000.`,
F07:`I first converted the situation into one number: how far over the limit the driver is. Then each fine tier becomes a simple test on that number, and the actual limit no longer matters. The top tier charges 100 only for the km/h beyond 20, which is why it uses (over - 20). Check: 30 over gives 1,000 + 10 x 100 = 2,000.`,
F08:`The flag-down rate already covers the first km, so the per-km charge applies only to the distance after it. The if (km > 1) protects short trips from a negative extra charge. Waiting time is a separate, simple addition. Check: 5 km and 10 minutes is 45 + 4 x 13.50 + 20 = 119.`,
F09:`The grade depends on the ratio of km to liters, so I calculated kilometers per liter once and compared that single variable. The boundaries 15 and 10 belong to the better grade, hence >=. Check: 200 / 16 = 12.5, which is 'G'.`,
F10:`I handled the rejection case first, because it needs no math at all. For the fee I looked for a pattern: 1 kg is 80, 2 kg is 110, 3 kg is 140, so it grows by 30 for every kg after the first. That pattern is the formula 80 + 30 x (kg - 1), and it works for 1 kg without a special case.`,
F11:`Dividing a whole number by 10 removes its last digit, so repeating that until the number reaches 0 takes exactly as many steps as there are digits. A counter records the steps. Check with 9045: 904, 90, 9, 0 is four steps.`,
F12:`Each pass of the loop is one day: climb, print, count the day, and slip back at night. The print must come right after the climb (3, 5, 7, 9, 11), before the slip. The snail does not slip on the day it escapes, which is why the slip is inside an if. The loop stops once the height reaches 10 or more, and days holds the answer.`,
F13:`I needed to tell apart two different ways the loop can end. A correct guess uses break, so the attempts counter stays below 3. Running out of tries leaves attempts at 3. That is why "Account locked" is printed only when attempts == 3, and why the two messages can never both appear.`,
F14:`This is a sentinel loop: the negative number is the stop signal, not data. So I read once before the loop, process inside, and read the next number at the end of each pass. That way the negative number is never counted. Two counters, even and odd, both start at 0.`,
F15:`The rule says to stop BEFORE a result goes above 1000, so I check the next product before committing to it: n * 3 <= 1000. If I multiplied first and checked afterwards, 2187 would be printed. The counter goes up once per multiplication.`,
F16:`I used two variables: i for the number being added and total for the running sum. The loop condition watches the total, but the question asks for the last number added, so i must be kept separately. When total finally passes 1000, i is 45 and total is 1035.`,
F17:`The loop depends on the running total, not on how many numbers were typed, so the condition is total < 100. Inside, I read a number, add it, and count it. Check: 40, 35, 30 gives totals 40, 75, 105, so the loop stops with count 3.`,
F18:`A menu program is a loop that repeats until the choice is 4, so choice starts at 0 to let the loop run once. One if / else if chain picks exactly one action per pass. Withdraw checks the balance before subtracting, and the "Invalid choice" branch excludes 4 because 4 just ends the loop. The balance is a double and prints with %.2f.`,
F19:`The for loop visits every number from 20 to 80 and the if filters them: a number is divisible by 6 when n % 6 is 0. The counter lives inside the if, so it counts only matches, and the final printf sits after the loop so it prints once.`,
F20:`Every number is either even or odd, so one if / else is enough, and each branch both prints and updates its own counter. The two total lines are printed after the loop ends. After 20 numbers, each counter must be 10, which is a good self-check.`,
F21:`Counting down flips all three parts of the for header: start at 100, test with >=, and use i--. Multiples of 10 have remainder 0 when divided by 10, so the if prints everything else. The counter is placed beside the printf so only printed numbers are counted, giving 90.`,
F22:`I needed to print each match and also keep a running sum. The sum starts at 0 before the loop and grows only inside the if that checks divisibility by 9. The 11 matches add up to 594, which confirms the logic.`,
F23:`The units digit of a number is its remainder when divided by 10, so "ends in 7" becomes i % 10 == 7. Checking i == 7 would find only one number, and i % 7 == 0 would find multiples of 7. The matches are 7, 17, ... 97, which is 10 numbers.`,
F24:`Night is awkward because it appears at both ends of the day. Instead of writing it as one range, I walk up the day in order (below 5, below 12, below 18, below 22) and let the last else catch hours 22 and 23. Each test can assume the earlier ones were false, so one comparison is enough.`,
F25:`I stored the salary in a variable and calculated every bonus from it. There are three groups of years, so there are three branches, tested from the smallest year upward. Printing happens after the if chain, so every year prints exactly one line with its bonus.`,
F26:`The loop step is 5 (age += 5) and the test is <= so that 70 is included. The price comes from an else-if ladder from the youngest group to the oldest. Check: age 10 is not below 4 but is 12 or less, so 150; age 60 fails every test and reaches the else, so 200.`,
F27:`The rule has two parts that must both be true, so I joined them with &&. "Not divisible by 5" is written with != 0. Without that second part the count would be 33; the 6 multiples of 15 must be excluded, leaving 27.`,
F28:`A number qualifies if it is divisible by 3 OR by 5, so one if with || is the right tool. Two separate ifs would count 15 and 30 twice. The count and the sum both grow inside that single if, and they are printed after the loop.`,
F29:`The loop counts by 5, so the step is score += 5. The grade comes from an else-if ladder that starts at the best grade, so each test needs only one comparison. The grade is stored in a char variable and printed with %c.`,
F30:`"Four or six but not both" is an exclusive OR. I wrote it in two layers: (divisible by 4 or by 6) and NOT divisible by both. A number divisible by both 4 and 6 is exactly a multiple of 12, so the exclusion is i % 12 != 0. This gives 15 numbers.`,
F31:`The formula is weight divided by height squared. The trap is precedence: weight / height * height divides first and gives back the weight. Putting height * height in parentheses forces the square to be computed first.`,
F32:`The return type is char, so each return is a single character in single quotes. I test from the top grade down, and since every branch returns immediately, no extra conditions like (score >= 80 && score < 90) are needed. The final return covers everything below 60.`,
F33:`The danger is integer division: 9 / 5 with whole numbers is 1, not 1.8. Because c is a double, c * 9 is already a decimal number, so dividing by 5 keeps the decimals. Both the parameter and the return type are double so values like 36.6 work. Check: 100 gives 212.`,
F34:`A discount of 20 means 20 percent, so the saved money is price x discount / 100. I calculated that first and then subtracted it from the price. Using doubles prevents 20 / 100 from becoming 0. Check: 1200 with 15 percent saves 180, giving 1,020.`,
F35:`Factorial is a product built one factor at a time, so a loop multiplies the result by 2, 3, ... n. The result starts at 1, because starting at 0 would make everything 0. For 0 and 1 the loop never runs, so 1 is returned, which is correct without a special case.`,
F36:`Two operators do all the work: n % 10 gives the last digit, and n / 10 removes it. I repeat that until n reaches 0 while adding the digits to a sum. Check with 9045: 5 + 4 + 0 + 9 = 18.`,
F37:`A number is not prime if any number from 2 to n - 1 divides it. So I assume it is prime, use a flag that turns off when a divisor is found, and print only after the loop has tried them all. Printing inside the loop would print many lines. The extra check n < 2 makes 1 "Not prime".`,
F38:`I keep one variable for the biggest value so far and update it when something larger appears. It starts from the first input and not from 0, so inputs like -5, -1, -8 still return -1. Ties such as 7, 7, 3 work automatically because "greater than" is false when values are equal.`,
F39:`A void function prints instead of returning, so the loop with printf goes inside it. Each row needs three values: the table number, the multiplier from 1 to 10, and their product. main just calls the function with a few different numbers.`,
F40:`A name is text, which in C is an array of characters, so the parameter is char name[] and printf uses %s for it. The age uses %d. The order of the variables must match the order of the placeholders, and the punctuation in the message must match exactly.`,
F41:`The sentence is easier as a PRINT rule than as a "skip unless" rule: print a number when it is not a multiple of 3, or when it is odd. So only the even multiples of 3 (6, 12, 18 ...) are skipped. The condition joins the two tests with ||.`,
F42:`In C, whole-number division already drops the remainder, so n / 2 is exactly the integer division the question asks for. The loop test n > 1 is checked before each halving, so the last 1 is still printed and then the loop ends. Check: 7 gives 3, 1.`,
F43:`I needed two digits of each number. The last digit is i % 10. The first digit is i / 10 for two-digit numbers, and the number itself for single digits. A number is printed only when the first digit is not greater than the last. Check: 20 and 31 are skipped; 13 and 22 are printed.`,
F44:`Order matters: subtract first, then check the NEW value. A negative result must not be printed, so that break comes before the printf. The number divisible by 6 must still be printed, so its break comes after the printf. Check with 25: 21, 17, 13, 9, 5, 1, then -3 stops the loop.`,
F45:`I rewrote the sentence as a PRINT rule: print a number if it is not divisible by 5, or if it is divisible by 3 (the exception). Only multiples of 5 that are not multiples of 3 are skipped. Check: 5 and 10 skip, 15 prints, 20 skips, 30 prints.`,
F46:`I read the start first and then the target. The loop condition is start < target, checked before each addition, so the number that reaches or passes the target is added and printed in its own last pass. The counter increases once per addition and is printed after the loop. Check: 1 and 20 gives 7, 13, 19, 25 and a count of 4.`,
F47:`For each number I need its digit sum, which is the "sum of digits" loop placed inside the for loop. I work on a copy (temp) so the for loop counter i is not destroyed. The number is printed only when the digit sum is odd.`,
F48:`Numbers with two identical digits (11, 22, ... 99) are all multiples of 11, so one test, i % 11 != 0, removes them. The counter sits beside the printf so only printed numbers are counted. Check: 10 to 25 has 16 numbers, minus 11 and 22, so 14.`,
F49:`This is also easier as a PRINT rule: print a number if it is not divisible by 6, or if it is greater than 80. So only multiples of 6 that are 80 or below are skipped. Check: 78 skips, 84 prints, 81 prints.`,
F50:`Divisible by both 3 and 4 needs two tests joined with && (it is the same as a multiple of 12). The number that triggers the stop must still be shown, so the order inside the loop is: add 5, print, then test and break. Adding 5 reaches a multiple of 12 within 12 steps, so the loop always ends.`,
F51:`This mirrors the earlier digit problem. The last digit is i % 10 and the first digit is i / 10 (or the number itself for single digits). It is simpler to write the PRINT rule: print when the last digit is not greater than the first. Check: 13 skips, 31 prints, 22 prints.`,
F52:`The loop must include the second number, so the test is <=. A number is printed only if it is not a multiple of 4, and the counter increases right beside the printf so skipped numbers are not counted. Check: 1 to 10 prints 1, 2, 3, 5, 6, 7, 9, 10, so the count is 8.`

  if(q.kind==="io"){const rs=await Promise.all(q.tests.map((t)=>judge(code,t.stdin)));const bad=rs.find((r)=>r.status===6);if(bad)return{err:bad.compile};
    return{cells:rs.map((r,i)=>r.status===3&&same(tokens(r.stdout,q.words,q.ignore),q.tests[i].expected)),tle:rs.some((r)=>r.status===5)};}
  const r=await judge(code,"\n");if(r.status===6)return{err:r.compile};if(r.status===5)return{err:"TLE"};
  const G=tokens(r.stdout,q.words,q.ignore),E=q.expected,n=same(G,E)?10:Math.min(9,Math.floor(10*lcs(G,E)/Math.max(G.length,E.length,1)));
  return{cells:Array.from({length:10},(_,i)=>i<n)};
}
async function run(){
  const c=ST.cur;if(!c||c.state!=="run"||cooling)return;const q=qOf(c.id);c.code=$("code").value;
  if(c.code.trim().length<15){msg('<div class="e">Write your code first.</div>');return;}
  c.runs++;save();$("run").disabled=true;$("run").textContent="Running...";msg("");showOutput(c,c.code);
  let g;try{g=await grade(q,c.code);}catch(e){g={err:e.message==="BUSY"?"BUSY":"NET"};}
  if(ST.cur!==c||c.state!=="run")return;
  $("run").textContent="Run tests";cooling=true;setTimeout(()=>{cooling=false;if(c.state==="run"&&$("run"))$("run").disabled=false;},CFG.cool*1000);
  if(g.err){c.journey.push(0);paintCells([]);damage();save();
    msg('<div class="e">'+(g.err==="TLE"?"Time limit exceeded. Check for a loop that never ends.":g.err==="BUSY"?"The code runner is busy. Wait a few seconds and run again.":g.err==="NET"?"Could not reach the code runner. Check the internet and run again.":"<b>Your code did not compile.</b><pre>"+esc(g.err.replace(/prog\.c|main\.c/g,"your code").slice(0,500))+"</pre>")+"</div>");return;}
  const n=g.cells.filter(Boolean).length;c.journey.push(n);c.best=Math.max(c.best,n);c.cells=g.cells;paintCells(g.cells);save();
  if(n===10){finish();return;}
  damage();msg("<b>"+n+" of 10 tests passed.</b> "+(n>=CFG.passMark?'You are in the <span style="color:var(--am)">50-point zone</span>. Keep going for 100!':"You need "+CFG.passMark+" for the 50-point zone.")+(g.tle?" One test ran too long (check for an endless loop).":""));
}
function damage(){document.body.classList.remove("hit");$("dmg").classList.remove("on");void document.body.offsetWidth;document.body.classList.add("hit");$("dmg").classList.add("on");}
/* ---------- finishing ---------- */
function finish(stop){
  const c=ST.cur;if(!c||c.state!=="run")return;c.state="done";c.stopped=!!stop;const q=qOf(c.id);
  const used=Math.min(CFG.seconds,Math.round(CFG.seconds-(c.endsAt-Date.now())/1000)),base=c.peeked?0:c.best>=10?100:c.best>=CFG.passMark?50:0,hints=c.hints||0,score=base?Math.max(0,base-10*hints):0;
  c.score=score;c.base=base;c.used=used;ST.taken[c.id]={name:c.name,score,base,hints,stopped:c.stopped,peeked:!!c.peeked,leaves:c.leaves||0,code:c.code,passed:c.best,runs:c.runs,secs:used,journey:c.journey,revealed:true,slot:c.slot};save();board();clock(CFG.seconds-used);
  if($("code"))$("code").disabled=true;if($("run"))$("run").disabled=true;if($("stop"))$("stop").disabled=true;if($("pause"))$("pause").disabled=true;document.querySelectorAll(".jkc").forEach((b)=>{b.disabled=true;});$("fsw").classList.remove("on");$("pz").classList.remove("on");result(c,q);
}
function result(c,q){
  const win=!c.peeked&&c.best>=10,mid=!win&&!c.peeked&&c.best>=CFG.passMark,rank=!win?"":c.used<180?"Lightning":c.used<360?"Sharp":"Steady";
  $("resB").innerHTML=(win?"":'<div class="slam">'+(c.peeked?"ANSWER REVEALED":c.stopped?"STOPPED":"TIME'S UP")+'</div>')+'<h2>'+(win?"You did it, "+esc(c.name)+"!":mid?"So close, "+esc(c.name)+"!":"Good try, "+esc(c.name)+".")+'</h2>'+(rank?'<div class="rank">'+rank+" solver</div>":"")+
   '<div class="big '+(win?"":mid?"amber":"red")+'" id="bigN">0</div><div style="color:var(--mu)">points</div><div class="cells" id="rc" style="margin:16px 0 0">'+'<div class="cell"></div>'.repeat(10)+'</div>'+
   '<div class="chips">'+c.journey.map((n,i)=>'<span class="jc" style="animation-delay:'+(.6+i*.1)+'s">'+n+'/10</span>').join('<span style="align-self:center;color:var(--mu)">&rarr;</span>')+'</div>'+
   '<div class="sub">'+c.runs+" run"+(c.runs===1?"":"s")+" &middot; "+mmss(c.used)+" used &middot; best "+c.best+"/10"+(c.hints?" &middot; "+c.hints+" joker"+(c.hints===1?"":"s")+" used (-"+c.hints*10+")":"")+"<br>"+(win?"Every test passed. That effort paid off.":mid?"You reached the 50-point zone. One more fix and it would have been perfect.":"Every run teaches something. You will get the next one.")+'</div><button class="btn" id="back" type="button">Back to the deck</button>';
  $("resM").classList.add("on");
  [...$("rc").children].forEach((d,i)=>{d.className="cell"+(i<c.best?" on":" off");d.style.animationDelay=(.2+i*.09)+"s";});
  const t0=performance.now(),target=c.score;(function f(t){const p=Math.min(1,(t-t0)/1200);$("bigN").textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);})(t0);
  clearInterval(rep);if(win){burst(80);rep=setInterval(()=>burst(60),1000);}else if(mid)burst(30);
  $("back").onclick=()=>{clearInterval(rep);$("resM").classList.remove("on");ST.cur=null;save();board();arena();};
}
function burst(n){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;const box=$("burst"),col=["#3ee6ff","#7cff6b","#ffb84d","#9b6bff","#ff6fae","#ffffff"],r=Math.random;
  for(let k=0;k<n;k++){const e=document.createElement("i"),left=k%2===0,y=4+r()*38;e.style.cssText=(left?"left:-14px":"left:100%")+";bottom:"+y.toFixed(1)+"%;--dx:"+((left?1:-1)*(22+r()*48)).toFixed(1)+"vw;--up:"+(-(18+r()*52)).toFixed(0)+"vh;--fall:"+(y+14+r()*6).toFixed(0)+"vh;--r:"+Math.round(r()*540-270)+"deg;--d:"+(r()*.25).toFixed(2)+"s;--t:"+(CFG.confettiMs/1000*(.7+r()*.3)).toFixed(2)+"s;background:"+col[k%col.length];box.appendChild(e);setTimeout(()=>e.remove(),CFG.confettiMs+500);}}
/* ---------- leaderboard, teacher panel ---------- */
function rows(){return Q.map((q,i)=>({q,t:ST.taken[q.id]})).filter((x)=>x.t&&x.t.score!=null).sort((a,b)=>b.t.score-a.t.score||(a.t.secs||0)-(b.t.secs||0));}
function lbOpen(){const r=rows(),med=["1st","2nd","3rd"];$("lbx").innerHTML='<h2>Leaderboard'+(ST.block?" - "+esc(ST.block):"")+'</h2>'+(r.length?'<table><tr><th>#</th><th>Name</th><th>Challenge</th><th>Score</th><th>Time</th></tr>'+r.map((x,i)=>'<tr><td><b>'+(med[i]||i+1)+"</b></td><td>"+esc(x.t.name)+"</td><td>"+esc(x.q.title)+"</td><td><b>"+x.t.score+"</b></td><td>"+mmss(x.t.secs||0)+"</td></tr>").join("")+"</table>":'<p class="sub">No finished rounds yet.</p>')+'<div class="row" style="margin-top:16px"><button class="btn g" id="lbx0" type="button">Close</button></div>';$("lbM").classList.add("on");$("lbx0").onclick=()=>$("lbM").classList.remove("on");}
$("lb").onclick=lbOpen;
function csv(){const r=[["Block","Name","Slot","Challenge","Tests passed","Score","Runs","Seconds used","Jokers used","Times left screen"]];Q.forEach((q)=>{const t=ST.taken[q.id];if(t){const cd=cardOf(slotOf(q.id));r.push([ST.block||"",t.name,cd.r+" of "+cd.name.split(" of ")[1],q.title,t.passed??"",t.score??"",t.runs??"",t.secs??"",t.hints??0,t.leaves??0]);}});(ST.log||[]).forEach((t)=>{const q=qOf(t.id);if(q){const cd=cardOf(slotOf(q.id));r.push([ST.block||"",t.name+" (earlier attempt)",cd.r+" of "+cd.name.split(" of ")[1],q.title,t.passed??"",t.score??"",t.runs??"",t.secs??"",t.hints??0,t.leaves??0]);}});return r.map((x)=>x.map((v)=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");}
function panel(){const c=ST.cur;$("tp").innerHTML='<h2>Teacher panel</h2><div class="row">'+(live()&&c.state!=="count"?'<button class="btn" data-a="plus">+1 minute</button><button class="btn g" data-a="pause">'+(c.state==="pause"?"Resume":"Pause")+'</button><button class="btn g" data-a="end">End now</button>':"")+'<button class="btn g" data-a="check">System check</button><button class="btn g" data-a="csv">Download CSV</button><button class="btn g" data-a="x">Close</button></div><div id="tpm" style="margin:8px 0;color:var(--mu)"></div><h3>Results</h3><table><tr><th>Card</th><th>Name</th><th>Challenge</th><th>Passed</th><th>Score</th><th></th></tr>'+
  Q.map((q)=>{const t=ST.taken[q.id];if(!t)return "";const cd=cardOf(slotOf(q.id));return "<tr><td>"+cd.r+cd.su+"</td><td>"+esc(t.name)+"</td><td>"+esc(q.title)+"</td><td>"+(t.passed??"-")+"/10"+(t.hints?" ("+t.hints+" jokers)":"")+(t.leaves?" &middot; left screen "+t.leaves+"x":"")+"</td><td><b>"+(t.score??"...")+'</b></td><td><div class="row">'+[0,50,100].map((s)=>'<button class="btn g" data-a="set" data-q="'+q.id+'" data-s="'+s+'">'+s+"</button>").join("")+'<button class="btn g" data-a="reopen" data-q="'+q.id+'">Reopen</button></div></td></tr>';}).join("")+"</table>";$("tpM").classList.add("on");}
document.addEventListener("keydown",(e)=>{if(e.shiftKey&&e.altKey&&e.key.toLowerCase()==="t")panel();});
$("tp").addEventListener("click",async(e)=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,c=ST.cur,m=$("tpm");
  if(a==="x"){$("tpM").classList.remove("on");return;}
  if(a==="plus"&&c){if(c.state==="run")c.endsAt+=60000;else c.left+=60;save();m.textContent="Added one minute.";}
  if(a==="pause"&&c){if(c.state==="run")pauseRound();else if(c.state==="pause")resumeRound();panel();}
  if(a==="end"&&c){if(c.state==="pause"){c.state="run";c.endsAt=Date.now();}finish();$("tpM").classList.remove("on");}
  if(a==="set"){const t=ST.taken[b.dataset.q];if(t){t.score=+b.dataset.s;t.base=t.score;if(ST.cur&&ST.cur.id===b.dataset.q)ST.cur.score=t.score;save();board();panel();}}
  if(a==="reopen"){delete ST.taken[b.dataset.q];if(viewId===b.dataset.q)viewId=null;if(ST.cur&&ST.cur.id===b.dataset.q){ST.cur=null;$("resM").classList.remove("on");clearInterval(rep);}save();board();arena();panel();}
  if(a==="csv"){const bl=new Blob([csv()],{type:"text/csv"}),l=document.createElement("a");l.href=URL.createObjectURL(bl);l.download="final-exam-results.csv";l.click();}
  if(a==="check"){m.textContent="Checking the code runner...";try{const r=await judge('#include <stdio.h>\nint main(void){printf("@@ok\\n");return 0;}\n');m.textContent=/@@ok/.test(r.stdout)?"Code runner is working.":"Code runner answered, but something is off.";}catch(er){m.textContent="Code runner is not reachable. Check the internet.";}}
});
$("player").addEventListener("dblclick",panel);
/* ---------- start / resume ---------- */
$("tml").textContent=mmss(CFG.seconds);board();arena();
if(ST.cur){const c=ST.cur;if(c.state==="count")countdown(beginRound);else if(c.state==="run"){clock((c.endsAt-Date.now())/1000);if(c.endsAt-Date.now()<=0)finish();}else if(c.state==="pause"){clock(c.left);showPause();}else if(c.state==="done")result(c,qOf(c.id));}
if(ST.cur&&(ST.cur.state==="run"||ST.cur.state==="count"))setTimeout(()=>guard("The page was reloaded."),0);
</script></body></html>
